version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      # One PR per week for all non-breaking updates.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Pinned to match the Playwright browser build; bump deliberately (see CONTRIBUTING).
      - dependency-name: '@playwright/test'
      - dependency-name: playwright-core
      # Removed in the redesign (R9); not upgraded meanwhile.
      - dependency-name: framer-motion
      # Tailwind 4 (and tailwind-merge 3, Tailwind-4-only) land together in redesign R1b.
      - dependency-name: tailwindcss
        update-types: ['version-update:semver-major']
      - dependency-name: tailwind-merge
        update-types: ['version-update:semver-major']
      # TypeScript 7: held until typescript-eslint supports it (see docs/redesign/STATE.md).
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ['*']
