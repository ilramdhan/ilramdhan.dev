name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint, unit tests, build & bundle budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Placeholder public config: the build only inlines these values;
          # nothing in CI talks to a real Supabase project.
          VITE_SUPABASE_URL: https://mock.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-dummy-anon-key
          # Prerender (T-35) against the e2e fixture dataset instead of the network.
          PRERENDER_MOCK: '1'

      # Baseline for the PR diff: build the base branch in a second checkout. Best effort:
      # if it fails, or the base lacks the --json flag, the comparison is skipped.
      - name: Checkout base for bundle comparison
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.base_ref }}
          path: base

      - name: Build base bundle baseline
        if: github.event_name == 'pull_request'
        continue-on-error: true
        working-directory: base
        run: |
          npm ci
          npm run build
          node scripts/check-bundle-size.mjs --json "$RUNNER_TEMP/base-size.json" || true
          test -s "$RUNNER_TEMP/base-size.json" || echo "Base has no --json support: skipping bundle comparison."
        env:
          VITE_SUPABASE_URL: https://mock.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-dummy-anon-key
          PRERENDER_MOCK: '1'

      - name: Bundle-size budget
        run: |
          if [ -s "$RUNNER_TEMP/base-size.json" ]; then
            npm run size -- --compare "$RUNNER_TEMP/base-size.json"
          else
            npm run size
          fi

  db-policies:
    name: DB policy tests (RLS + storage)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Run policy tests
        run: bash scripts/test-db-policies.sh
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
