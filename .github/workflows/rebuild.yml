name: Scheduled rebuild

# Daily redeploy so prerendered pages (T-35) pick up content that changed without a
# database webhook firing (e.g. a post whose `published_at` was in the future).
# Off by default: set the repository variable ENABLE_SCHEDULED_REBUILD=true and the
# secret VERCEL_DEPLOY_HOOK_URL (Vercel -> Settings -> Git -> Deploy Hooks).

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  rebuild:
    if: vars.ENABLE_SCHEDULED_REBUILD == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Vercel deploy hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK_URL is not set; nothing to do."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "Deploy hook triggered."
