<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>%SITE_TITLE%</title>
    <meta name="title" content="%SITE_TITLE%" />
    <meta name="description" content="%SITE_DESCRIPTION%" />
    <meta name="author" content="%SITE_NAME%" />
    <meta name="robots" content="index, follow" />

    <!-- Theme: applied before first paint to avoid a flash of the wrong theme -->
    <script>
      !(function () {
        try {
          var t = localStorage.getItem('theme'),
            d =
              t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches),
            e = document.documentElement;
          e.classList.toggle('dark', d);
          e.style.colorScheme = d ? 'dark' : 'light';
        } catch (a) {}
      })();
    </script>
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="%SITE_TITLE%" />
    <meta property="og:description" content="%SITE_OG_DESCRIPTION%" />
    <meta property="og:image" content="%SITE_OG_IMAGE%" />
    <meta property="og:site_name" content="%SITE_NAME%" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%SITE_TITLE%" />
    <meta name="twitter:description" content="%SITE_OG_DESCRIPTION%" />
    <meta name="twitter:image" content="%SITE_OG_IMAGE%" />

    <!-- Favicons: SVG adapts to light/dark inside the file; PNG/ICO are fallbacks -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Structured Data (JSON-LD) is injected from src/config/site.ts by vite.config.ts -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
